spring:
  application:
    name: backend
  datasource:
    url: jdbc:h2:mem:appdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  error:
    include-message: always

security:
  jwt:
    # HMAC signing key for JwtService; swap per env on Render etc., never commit real prod secrets.
    secret: "change-this-secret-key-at-least-32-characters-long"
    expiration-ms: 86400000
